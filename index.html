<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pıttıkcxn - FiveM</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #000 url('https://cdn.discordapp.com/attachments/1005219866690736129/1238164510079058010/5.gif?ex=6969148f&is=6967c30f&hm=00892cd3ee5931c7cace3bdba3786b533362b9331c07f6116a7950b01c589b19') no-repeat center center fixed;
      background-size: cover;
      color: #ff0044;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: -1;
    }
    #menu {
      text-align: center;
      z-index: 10;
    }
    #gameFrame {
      width: 70%;
      height: 60vh;
      border: 5px solid #ff0044;
      box-shadow: 0 0 40px #ff0044;
      background: rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: none;
    }
    .gameBtn {
      display: block;
      width: 300px;
      padding: 20px;
      margin: 15px auto;
      font-size: 2rem;
      background: #ff0044;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #ff0044;
      transition: all 0.3s;
    }
    .gameBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px #ff0044;
    }
    #tokenText {
      font-size: 1.8rem;
      color: #00ff9d;
      text-shadow: 0 0 15px #00ff9d;
      text-align: center;
      margin-top: 20px;
      letter-spacing: 5px;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 8rem;
      color: #ff0000;
      text-shadow: 0 0 40px #ff0000;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s;
      z-index: 20;
    }
    #restartBtn {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 60px;
      font-size: 2.5rem;
      background: #00ff9d;
      color: #000;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 0 30px #00ff9d;
      display: none;
      z-index: 20;
    }
    #restartBtn:hover {
      transform: scale(1.1);
    }
    #ytPlayerContainer {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div id="menu">
    <div id="gameFrame">
      <canvas id="gameCanvas"></canvas>
      <div id="gameOver">GAME OVER</div>
      <button id="restartBtn">RESTART</button>
    </div>
    <button class="gameBtn" onclick="startSnake()">1. Yılan</button>
    <button class="gameBtn" onclick="startPacman()">2. Pac-Man</button>
    <div id="tokenText">best dou tokencxn</div>
  </div>

  <div id="ytPlayerContainer">
    <div id="ytplayer"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let ytPlayer;
    let currentGame = null;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameOverEl = document.getElementById('gameOver');
    const restartBtn = document.getElementById('restartBtn');

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Müzik başlat
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytplayer', {
        height: '1',
        width: '1',
        videoId: 'NMRhx71bGo4',
        playerVars: { autoplay: 0, loop: 1, playlist: 'NMRhx71bGo4', controls: 0, showinfo: 0, rel: 0, mute: 1 },
        events: { onReady: e => e.target.playVideo() }
      });
    }

    function startMusic() {
      if (ytPlayer && ytPlayer.unMute) {
        ytPlayer.unMute();
        ytPlayer.setVolume(40);
      }
    }

    // Ortak reset
    function resetGame() {
      gameOverEl.style.opacity = '0';
      restartBtn.style.display = 'none';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Yılan oyunu (önceki fix'li)
    function startSnake() {
      startMusic();
      resetGame();
      document.getElementById('gameCanvas').style.display = 'block';
      currentGame = 'snake';

      const grid = 20;
      let count = 0;
      let gameActive = true;

      let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
      let apple = { x: 320, y: 320 };

      function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

      function showGameOver() {
        gameActive = false;
        gameOverEl.style.opacity = '1';
        setTimeout(() => restartBtn.style.display = 'block', 2000);
      }

      function loop() {
        if (!gameActive || currentGame !== 'snake') return;
        requestAnimationFrame(loop);

        if (++count < 8) return;
        count = 0;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        snake.x += snake.dx;
        snake.y += snake.dy;

        if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) {
          showGameOver();
          return;
        }

        snake.cells.unshift({x: snake.x, y: snake.y});
        if (snake.cells.length > snake.maxCells) snake.cells.pop();

        if (snake.x === apple.x && snake.y === apple.y) {
          snake.maxCells++;
          apple.x = getRandomInt(0, canvas.width / grid) * grid;
          apple.y = getRandomInt(0, canvas.height / grid) * grid;
        }

        ctx.fillStyle = '#ff0044';
        ctx.fillRect(apple.x, apple.y, grid-2, grid-2);

        ctx.fillStyle = '#00ff9d';
        snake.cells.forEach((cell, index) => {
          ctx.fillRect(cell.x, cell.y, grid-2, grid-2);
          if (index === 0) ctx.fillStyle = '#00ccff';
        });

        for (let i = 1; i < snake.cells.length; i++) {
          if (snake.x === snake.cells[i].x && snake.y === snake.cells[i].y) {
            showGameOver();
            return;
          }
        }
      }

      document.addEventListener('keydown', e => {
        if (!gameActive || currentGame !== 'snake') return;
        if (e.key === 'ArrowLeft' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
        else if (e.key === 'ArrowUp' && snake.dy === 0) { snake.dx = 0; snake.dy = -grid; }
        else if (e.key === 'ArrowRight' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
        else if (e.key === 'ArrowDown' && snake.dy === 0) { snake.dx = 0; snake.dy = grid; }
      });

      loop();
    }

    // Pac-Man basit versiyon (klasik, no lib)
    function startPacman() {
      startMusic();
      resetGame();
      document.getElementById('gameCanvas').style.display = 'block';
      currentGame = 'pacman';

      // Basit Pac-Man (örnek kod, senin istediğin gibi)
      let pacman = { x: canvas.width / 2, y: canvas.height / 2, radius: 20, speed: 5, dir: 'right' };
      let mouthAngle = 0;
      let mouthOpening = true;

      function loop() {
        if (!gameActive || currentGame !== 'pacman') return;
        requestAnimationFrame(loop);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Pac-Man çiz
        ctx.fillStyle = 'yellow';
        ctx.beginPath();
        ctx.arc(pacman.x, pacman.y, pacman.radius, mouthAngle, Math.PI * 2 - mouthAngle);
        ctx.lineTo(pacman.x, pacman.y);
        ctx.fill();

        // Ağız aç/kapa animasyon
        if (mouthOpening) mouthAngle += 0.1;
        else mouthAngle -= 0.1;
        if (mouthAngle > Math.PI / 4) mouthOpening = false;
        if (mouthAngle < 0) mouthOpening = true;

        // Hareket (ok tuşları)
        if (pacman.dir === 'right') pacman.x += pacman.speed;
        else if (pacman.dir === 'left') pacman.x -= pacman.speed;
        else if (pacman.dir === 'up') pacman.y -= pacman.speed;
        else if (pacman.dir === 'down') pacman.y += pacman.speed;

        // Kenar wrap (Pac-Man gibi)
        if (pacman.x > canvas.width) pacman.x = 0;
        if (pacman.x < 0) pacman.x = canvas.width;
        if (pacman.y > canvas.height) pacman.y = 0;
        if (pacman.y < 0) pacman.y = canvas.height;
      }

      document.addEventListener('keydown', e => {
        if (!gameActive || currentGame !== 'pacman') return;
        if (e.key === 'ArrowRight') pacman.dir = 'right';
        if (e.key === 'ArrowLeft') pacman.dir = 'left';
        if (e.key === 'ArrowUp') pacman.dir = 'up';
        if (e.key === 'ArrowDown') pacman.dir = 'down';
      });

      loop();
    }

    restartBtn.onclick = () => {
      if (currentGame === 'snake') startSnake();
      else if (currentGame === 'pacman') startPacman();
    };
  </script>
</body>
</html>
