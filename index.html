<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pıttıkcxn - FiveM</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #000 url('https://cdn.discordapp.com/attachments/1005219866690736129/1238164510079058010/5.gif?ex=6969148f&is=6967c30f&hm=00892cd3ee5931c7cace3bdba3786b533362b9331c07f6116a7950b01c589b19') no-repeat center center fixed;
      background-size: cover;
      color: #ff0044;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: -1;
    }
    #menu {
      display: flex;
      align-items: center;
      gap: 50px;
      z-index: 10;
    }
    #gameFrame {
      width: 60vw; /* 100% genişlik hissi, responsive */
      height: 35vh; /* tam senin dediğin %35 yükseklik */
      border: 5px solid #ff0044;
      box-shadow: 0 0 40px #ff0044;
      background: rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block; /* her zaman block, game'ler üstüne yazar */
    }
    .gameBtns {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .gameBtn {
      width: 200px;
      padding: 20px;
      font-size: 1.8rem;
      background: #ff0044;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #ff0044;
      transition: all 0.3s;
    }
    .gameBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px #ff0044;
    }
    #tokenText {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      color: #00ff9d;
      text-shadow: 0 0 15px #00ff9d;
      letter-spacing: 4px;
      z-index: 15;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 20px;
      font-size: 2rem;
      color: #fff;
      text-shadow: 0 0 10px #fff;
      z-index: 15;
    }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6rem;
      color: #ff0000;
      text-shadow: 0 0 40px #ff0000;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s;
      z-index: 20;
    }
    #restartBtn {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 40px;
      font-size: 2rem;
      background: #00ff9d;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 30px #00ff9d;
      display: none;
      z-index: 20;
    }
    #restartBtn:hover {
      transform: translate(-50%, -50%) scale(1.1);
    }
    #ytPlayerContainer {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div id="menu">
    <div id="gameFrame">
      <canvas id="gameCanvas"></canvas>
      <div id="score">Skor: 0</div>
      <div id="gameOver">GAME OVER</div>
      <button id="restartBtn" onclick="restartCurrentGame()">RESTART</button>
    </div>
    <div class="gameBtns">
      <button class="gameBtn" onclick="startSnake()">1. Yılan</button>
      <button class="gameBtn" onclick="startPacman()">2. Pac-Man</button>
    </div>
  </div>
  <div id="tokenText">best dou tokencxn</div>

  <div id="ytPlayerContainer">
    <div id="ytplayer"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let ytPlayer;
    let currentGame = null;
    let score = 0;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('gameOver');
    const restartBtn = document.getElementById('restartBtn');

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Müzik
    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytplayer', {
        height: '1',
        width: '1',
        videoId: 'NMRhx71bGo4',
        playerVars: { autoplay: 1, loop: 1, playlist: 'NMRhx71bGo4', controls: 0, mute: 1 },
        events: { onReady: e => { e.target.unMute(); e.target.setVolume(40); } }
      });
    }

    function updateScore(newScore) {
      score = newScore;
      scoreEl.textContent = 'Skor: ' + score;
    }

    function showGameOver() {
      gameOverEl.style.opacity = '1';
      setTimeout(() => restartBtn.style.display = 'block', 1500);
    }

    function hideGameOver() {
      gameOverEl.style.opacity = '0';
      restartBtn.style.display = 'none';
    }

    function restartCurrentGame() {
      hideGameOver();
      if (currentGame === 'snake') startSnake();
      else if (currentGame === 'pacman') startPacman();
    }

    // Yılan
    let snakeLoopId;
    function startSnake() {
      startMusic();
      hideGameOver();
      updateScore(0);
      currentGame = 'snake';

      const grid = 20;
      let count = 0;
      let gameActive = true;

      let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
      let apple = { x: 320, y: 320 };

      function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

      function loop() {
        if (!gameActive) return;
        snakeLoopId = requestAnimationFrame(loop);

        if (++count < 8) return;
        count = 0;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        snake.x += snake.dx;
        snake.y += snake.dy;

        if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) {
          gameActive = false;
          showGameOver();
          return;
        }

        snake.cells.unshift({x: snake.x, y: snake.y});
        if (snake.cells.length > snake.maxCells) snake.cells.pop();

        if (snake.x === apple.x && snake.y === apple.y) {
          snake.maxCells++;
          updateScore(snake.maxCells - 4);
          apple.x = getRandomInt(0, canvas.width / grid) * grid;
          apple.y = getRandomInt(0, canvas.height / grid) * grid;
        }

        ctx.fillStyle = '#ff0044';
        ctx.fillRect(apple.x, apple.y, grid-2, grid-2);

        ctx.fillStyle = '#00ff9d';
        snake.cells.forEach((cell, index) => {
          ctx.fillRect(cell.x, cell.y, grid-2, grid-2);
          ctx.fillStyle = index === 0 ? '#00ccff' : '#00ff9d';
        });

        for (let i = 1; i < snake.cells.length; i++) {
          if (snake.x === snake.cells[i].x && snake.y === snake.cells[i].y) {
            gameActive = false;
            showGameOver();
            return;
          }
        }
      }

      document.removeEventListener('keydown', pacmanKeyHandler);
      document.addEventListener('keydown', snakeKeyHandler);

      function snakeKeyHandler(e) {
        if (!gameActive) return;
        if (e.key === 'ArrowLeft' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
        else if (e.key === 'ArrowUp' && snake.dy === 0) { snake.dx = 0; snake.dy = -grid; }
        else if (e.key === 'ArrowRight' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
        else if (e.key === 'ArrowDown' && snake.dy === 0) { snake.dx = 0; snake.dy = grid; }
      }

      loop();
    }

    // Pac-Man
    let pacmanLoopId;
    function startPacman() {
      startMusic();
      hideGameOver();
      updateScore(0);
      currentGame = 'pacman';

      const pacRadius = 25;
      let pacX = canvas.width / 2;
      let pacY = canvas.height / 2;
      let pacDir = 0; // 0 right, 1 down, 2 left, 3 up
      let pacSpeed = 4;
      let mouthAngle = 0;
      let mouthDir = 1;

      let ghosts = [
        { x: 100, y: 100, dx: 2, dy: 2, color: '#ff0000' },
        { x: canvas.width - 100, y: 100, dx: -2, dy: 2, color: '#ff69b4' },
        { x: 100, y: canvas.height - 100, dx: 2, dy: -2, color: '#00ff00' },
        { x: canvas.width - 100, y: canvas.height - 100, dx: -2, dy: -2, color: '#00bfff' }
      ];

      let dots = [];
      for (let i = 0; i < 50; i++) {
        dots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          eaten: false
        });
      }

      function loop() {
        if (!gameActive) return;
        pacmanLoopId = requestAnimationFrame(loop);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Pac-Man hareket
        if (pacDir === 0) pacX += pacSpeed;
        if (pacDir === 1) pacY += pacSpeed;
        if (pacDir === 2) pacX -= pacSpeed;
        if (pacDir === 3) pacY -= pacSpeed;

        // Wrap
        if (pacX > canvas.width) pacX = 0;
        if (pacX < 0) pacX = canvas.width;
        if (pacY > canvas.height) pacY = 0;
        if (pacY < 0) pacY = canvas.height;

        // Ağız animasyon
        mouthAngle += mouthDir * 0.15;
        if (mouthAngle > Math.PI / 3) mouthDir = -1;
        if (mouthAngle < 0) mouthDir = 1;

        ctx.fillStyle = 'yellow';
        ctx.beginPath();
        ctx.arc(pacX, pacY, pacRadius, mouthAngle, Math.PI * 2 - mouthAngle);
        ctx.lineTo(pacX, pacY);
        ctx.fill();

        // Hayaletler
        ghosts.forEach(ghost => {
          ghost.x += ghost.dx;
          ghost.y += ghost.dy;
          if (ghost.x < 0 || ghost.x > canvas.width) ghost.dx *= -1;
          if (ghost.y < 0 || ghost.y > canvas.height) ghost.dy *= -1;

          ctx.fillStyle = ghost.color;
          ctx.beginPath();
          ctx.arc(ghost.x, ghost.y, pacRadius, 0, Math.PI * 2);
          ctx.fill();
        });

        // Nokta yeme
        dots.forEach(dot => {
          if (!dot.eaten && Math.hypot(pacX - dot.x, pacY - dot.y) < pacRadius) {
            dot.eaten = true;
            updateScore(score + 10);
          }
          if (!dot.eaten) {
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, 5, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // Hayalet çarpma
        ghosts.forEach(ghost => {
          if (Math.hypot(pacX - ghost.x, pacY - ghost.y) < pacRadius * 1.5) {
            gameActive = false;
            showGameOver();
          }
        });
      }

      document.removeEventListener('keydown', snakeKeyHandler);
      document.addEventListener('keydown', pacmanKeyHandler);

      function pacmanKeyHandler(e) {
        if (!gameActive) return;
        if (e.key === 'ArrowRight') pacDir = 0;
        else if (e.key === 'ArrowDown') pacDir = 1;
        else if (e.key === 'ArrowLeft') pacDir = 2;
        else if (e.key === 'ArrowUp') pacDir = 3;
      }

      loop();
    }

    function startMusic() {
      if (ytPlayer) {
        ytPlayer.unMute();
        ytPlayer.setVolume(40);
      }
    }
  </script>
</body>
</html>
