<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENKA Kuyumculuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: #FFD700;
      font-family: 'Goldman', sans-serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .founder {
      position: absolute;
      top: 10px;
      left: 15px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #FFD700;
      z-index: 10;
    }
    .founder-sub {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 3px;
    }
    .page {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.6s ease-in-out;
      padding: 15vh 5vw 5vh; /* Üstten boşluk + kenar boşlukları */
    }
    .page.active {
      display: flex;
      transform: translateX(0);
    }
    .page.sliding-right {
      transform: translateX(100%);
    }
    .page.sliding-left {
      transform: translateX(-100%);
    }
    .title {
      font-size: 5rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 4px;
      text-align: center;
      line-height: 1.1;
    }
    .sub-title {
      font-size: 1.5rem;
      margin-bottom: 30px;
      text-align: center;
    }
    .welcome {
      font-size: 2.5rem;
      margin-bottom: 50px;
      text-align: center;
    }
    .arrow-box {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 70px;
      height: 70px;
      background: rgba(0,0,0,0.6);
      border: 3px solid #FFD700;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .arrow-box:hover {
      background: rgba(255,215,0,0.15);
      transform: translateY(-50%) scale(1.15);
    }
    .arrow {
      font-size: 2.5rem;
      color: #FFD700;
    }
    #next-arrow, #next-arrow-page2 {
      right: 15px;
    }
    #prev-arrow, #prev-arrow-page3 {
      left: 15px;
    }
    #intro-page {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5vw;
    }
    #intro-button {
      padding: 20px 80px;
      font-size: 3rem;
      background: #000;
      color: #FFD700;
      border: 5px solid #FFD700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s;
      width: 80%;
      max-width: 400px;
      text-align: center;
    }
    #intro-button:hover {
      background: #FFD700;
      color: #000;
      transform: scale(1.05);
    }

    /* Mobil uyum (küçük ekranlar için) */
    @media (max-width: 768px) {
      .title {
        font-size: 3.5rem;
      }
      .sub-title {
        font-size: 1.2rem;
      }
      .welcome {
        font-size: 1.8rem;
      }
      .arrow-box {
        width: 60px;
        height: 60px;
      }
      .arrow {
        font-size: 2rem;
      }
      #intro-button {
        font-size: 2.5rem;
        padding: 15px 60px;
      }
      .founder {
        font-size: 1.2rem;
        left: 20px;
      }
      .founder-sub {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .title {
        font-size: 2.8rem;
      }
      .sub-title {
        font-size: 1rem;
      }
      .welcome {
        font-size: 1.5rem;
      }
      .arrow-box {
        width: 50px;
        height: 50px;
      }
      .arrow {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="founder">
    Founder
    <div class="founder-sub">Faruk Can Asker</div>
  </div>

  <!-- Giriş sayfası -->
  <div id="intro-page" class="page active">
    <button id="intro-button">GİRİŞ</button>
  </div>

  <!-- Sayfa 1: Hoşgeldiniz -->
  <div id="page1" class="page">
    <div class="title">ENKA</div>
    <div class="sub-title">kuyumculuk</div>
    <div class="welcome">HOŞGELDİNİZ</div>
    <div id="next-arrow" class="arrow-box"><div class="arrow">→</div></div>
  </div>

  <!-- Sayfa 2: Pullu Zincir -->
  <div id="page2" class="page">
    <div class="title">Pullu Zincir</div>
    <div class="sub-title">(Fotoğraflar yakında eklenecek)</div>
    <div id="prev-arrow" class="arrow-box"><div class="arrow">←</div></div>
    <div id="next-arrow-page2" class="arrow-box"><div class="arrow">→</div></div>
  </div>

  <!-- Sayfa 3: Pullu Bileklik -->
  <div id="page3" class="page">
    <div class="title">Pullu Bileklik</div>
    <div class="sub-title">(Fotoğraflar yakında eklenecek)</div>
    <div id="prev-arrow-page3" class="arrow-box"><div class="arrow">←</div></div>
  </div>

  <script>
    const introPage = document.getElementById('intro-page');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const page3 = document.getElementById('page3');

    const introButton = document.getElementById('intro-button');
    const nextArrowPage1 = document.getElementById('next-arrow');
    const prevArrowPage2 = document.getElementById('prev-arrow');
    const nextArrowPage2 = document.getElementById('next-arrow-page2');
    const prevArrowPage3 = document.getElementById('prev-arrow-page3');

    function goToPage(current, next) {
      current.classList.add('sliding-right');
      setTimeout(() => {
        current.style.display = 'none';
        current.classList.remove('sliding-right');
        next.style.display = 'flex';
        next.classList.add('active');
      }, 600);
    }

    function goBackPage(current, prev) {
      current.classList.add('sliding-left');
      setTimeout(() => {
        current.style.display = 'none';
        current.classList.remove('sliding-left');
        prev.style.display = 'flex';
        prev.classList.add('active');
      }, 600);
    }

    introButton.addEventListener('click', () => {
      introPage.style.display = 'none';
      page1.style.display = 'flex';
      page1.classList.add('active');
    });

    nextArrowPage1.addEventListener('click', () => goToPage(page1, page2));

    prevArrowPage2.addEventListener('click', () => goBackPage(page2, page1));

    nextArrowPage2.addEventListener('click', () => goToPage(page2, page3));

    prevArrowPage3.addEventListener('click', () => goBackPage(page3, page2));
  </script>
</body>
</html>
