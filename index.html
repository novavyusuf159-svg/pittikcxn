<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ENKA Kuyumculuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: #FFD700;
      font-family: 'Goldman', sans-serif;
      min-height: 100vh;
      overflow-y: auto;
      position: relative;
    }
    .founder {
      position: fixed;
      top: 10px;
      left: 15px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #FFD700;
      z-index: 100;
    }
    .founder-sub {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 3px;
    }
    .header-icons {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 1000;
    }
    .instagram-logo, .custom-logo {
      width: 50px;
      height: 50px;
      cursor: pointer;
      transition: all 0.3s;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,215,0,0.4);
    }
    .instagram-logo:hover, .custom-logo:hover {
      transform: scale(1.15);
      box-shadow: 0 0 30px #FFD700;
    }
    .bottom-left-logo {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 80px;
      height: 80px;
      z-index: 999;
      cursor: pointer;
      transition: all 0.3s;
      border-radius: 50%;
      border: 4px solid #FFD700;
      box-shadow: 0 0 25px rgba(255,215,0,0.5);
    }
    .bottom-left-logo:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px #FFD700;
    }
    .page {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 15vh 5vw 140px;
    }
    .page.active {
      display: flex;
    }
    .title {
      font-size: 3.5rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 3px;
      text-align: center;
    }
    .sub-title {
      font-size: 1.3rem;
      margin-bottom: 25px;
      text-align: center;
    }
    .welcome {
      font-size: 2rem;
      margin-bottom: 40px;
      text-align: center;
    }
    .product-gallery {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 95%;
      max-width: 500px;
      margin: 20px 0 80px;
    }
    .product-img {
      width: 100%;
      border: 4px solid #FFD700;
      border-radius: 15px;
      box-shadow: 0 0 20px #FFD700;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .product-img:hover {
      transform: scale(1.03);
    }
    .arrow-container {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 9999;
      pointer-events: auto;
    }
    .arrow-box {
      width: 80px;
      height: 80px;
      background: rgba(0,0,0,0.8);
      border: 5px solid #FFD700;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 15px #FFD700;
    }
    .arrow-box:hover {
      background: rgba(255,215,0,0.3);
      transform: scale(1.2);
    }
    .arrow {
      font-size: 3rem;
      color: #FFD700;
    }
    #intro-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0 5vw;
    }
    #intro-button {
      padding: 20px 80px;
      font-size: 3rem;
      background: #000;
      color: #FFD700;
      border: 6px solid #FFD700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s;
    }
    #intro-button:hover {
      background: #FFD700;
      color: #000;
      transform: scale(1.05);
    }

    /* Fotoğraf büyütme modal (normal fotoğraflar için) */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
      overflow: auto;
      backdrop-filter: blur(5px);
    }
    .modal-content {
      max-width: 90%;
      max-height: 85vh;
      border: 6px solid #FFD700;
      border-radius: 20px;
      box-shadow: 0 0 60px #FFD700, 0 0 100px rgba(255,215,0,0.5);
      cursor: pointer;
      animation: zoomIn 0.4s ease;
      object-fit: contain;
    }
    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: #FFD700;
      font-size: 4.5rem;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 0 15px #FFD700;
      transition: all 0.3s;
    }
    .close:hover {
      color: #fff;
      transform: rotate(90deg);
      text-shadow: 0 0 30px #FFD700;
    }

    /* Mobil dik mod */
    @media (max-width: 768px) {
      .title {
        font-size: 2.8rem;
      }
      .sub-title {
        font-size: 1.1rem;
      }
      .welcome {
        font-size: 1.6rem;
      }
      .product-img {
        max-height: 35vh;
      }
      .arrow-box {
        width: 70px;
        height: 70px;
      }
      .arrow {
        font-size: 2.8rem;
      }
      .product-gallery {
        gap: 25px;
      }
      .modal-content {
        max-width: 95%;
        max-height: 80vh;
      }
      .close {
        font-size: 4rem;
        top: 20px;
        right: 25px;
      }
      .instagram-logo, .custom-logo {
        width: 45px;
        height: 45px;
      }
      .header-icons {
        gap: 10px;
        right: 10px;
      }
      .bottom-center-logo {
        width: 70px;
        height: 70px;
        bottom: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="founder">
    Founder
    <div class="founder-sub">Faruk Can Asker</div>
  </div>

  <!-- Sağ üst ikonlar (Instagram + eski logo) -->
  <div class="header-icons">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/1024px-Instagram_icon.png" alt="Instagram" class="instagram-logo" onclick="window.open('https://www.instagram.com/enka_kuyumculuk/', '_blank')">
    <img src="https://i.imgur.com/Cn73zlU.png" alt="ENKA Logo" class="custom-logo" onclick="window.open('https://www.instagram.com/enka_kuyumculuk/', '_blank')">
  </div>

  <!-- En altta ortada sabit logo (tıklayınca özel fotoğraf modalı) -->
  <img src="https://i.imgur.com/KvzGKxo.png" alt="ENKA Logo" class="bottom-center-logo" onclick="openLogoModal()">

  <!-- Giriş sayfası -->
  <div id="intro-page" class="page active">
    <button id="intro-button">GİRİŞ</button>
  </div>

  <!-- Sayfa 1: Hoşgeldiniz -->
  <div id="page1" class="page">
    <div class="title">ENKA</div>
    <div class="sub-title">kuyumculuk</div>
    <div class="welcome">HOŞGELDİNİZ</div>
  </div>

  <!-- Sayfa 2: Pullu Zincir -->
  <div id="page2" class="page">
    <div class="title">Pullu Zincir</div>
    <div class="sub-title">Altın pullu zincir modelleri</div>
    <div class="product-gallery">
      <img src="https://i.imgur.com/PHUKcgC.png" alt="Zincir 1" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/8vUboG3.png" alt="Zincir 2" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/ycqXYHy.png" alt="Zincir 3" class="product-img" onclick="openModal(this.src)">
    </div>
  </div>

  <!-- Sayfa 3: Pullu Bileklik -->
  <div id="page3" class="page">
    <div class="title">Pullu Bileklik</div>
    <div class="sub-title">Altın pullu bileklik modelleri</div>
    <div class="product-gallery">
      <img src="https://i.imgur.com/B1W7QdF.png" alt="Bileklik 1" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/j8zGzpc.png" alt="Bileklik 2" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/cReTEWw.png" alt="Bileklik 3" class="product-img" onclick="openModal(this.src)">
    </div>
  </div>

  <!-- Oklar (altta sabit) -->
  <div class="arrow-container">
    <div id="prev-arrow" class="arrow-box"><div class="arrow">←</div></div>
    <div id="next-arrow" class="arrow-box"><div class="arrow">→</div></div>
  </div>

  <!-- Normal fotoğraf büyütme modal -->
  <div id="modal" class="modal" onclick="closeModal()">
    <span class="close" onclick="closeModal()">×</span>
    <img class="modal-content" id="modalImg">
  </div>

  <!-- Logo tıklayınca çıkan özel modal (senin attığın fotoğraf) -->
  <div id="logoModal" class="modal" onclick="closeLogoModal()">
    <span class="close" onclick="closeLogoModal()">×</span>
    <img class="modal-content" id="logoModalImg" src="https://i.imgur.com/O9LR3Gj.png">
  </div>

  <script>
    const introPage = document.getElementById('intro-page');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const page3 = document.getElementById('page3');

    const introButton = document.getElementById('intro-button');
    const prevArrow = document.getElementById('prev-arrow');
    const nextArrow = document.getElementById('next-arrow');

    let currentPage = introPage;

    function showPage(targetPage) {
      if (currentPage === targetPage) return;
      currentPage.style.display = 'none';
      targetPage.style.display = 'flex';
      currentPage = targetPage;
    }

    introButton.addEventListener('click', () => showPage(page1));

    nextArrow.addEventListener('click', () => {
      if (currentPage === introPage) showPage(page1);
      else if (currentPage === page1) showPage(page2);
      else if (currentPage === page2) showPage(page3);
    });

    prevArrow.addEventListener('click', () => {
      if (currentPage === page3) showPage(page2);
      else if (currentPage === page2) showPage(page1);
      else if (currentPage === page1) showPage(introPage);
    });

    // Normal fotoğraf modalı
    function openModal(src) {
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = src;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    // Logo tıklayınca çıkan özel modal
    function openLogoModal() {
      document.getElementById('logoModal').style.display = 'flex';
    }

    function closeLogoModal() {
      document.getElementById('logoModal').style.display = 'none';
    }
  </script>
</body>
</html>
