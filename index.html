<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ENKA Kuyumculuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: #FFD700;
      font-family: 'Goldman', sans-serif;
      min-height: 100vh;
      overflow-y: auto;
      position: relative;
    }
    .founder {
      position: fixed;
      top: 8px;
      left: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #FFD700;
      z-index: 100;
    }
    .founder-sub {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 2px;
    }
    .page {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10vh 4vw 140px;
    }
    .page.active {
      display: flex;
    }
    .title {
      font-size: 2.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-align: center;
    }
    .sub-title {
      font-size: 1.1rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .welcome {
      font-size: 1.6rem;
      margin-bottom: 35px;
      text-align: center;
    }
    .product-gallery {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 95%;
      max-width: 450px;
      margin: 15px 0 80px;
    }
    .product-img {
      width: 100%;
      border: 3px solid #FFD700;
      border-radius: 12px;
      box-shadow: 0 0 15px #FFD700;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .product-img:hover {
      transform: scale(1.03);
    }
    .arrow-container {
      position: fixed;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 9999;
      pointer-events: auto;
    }
    .arrow-box {
      width: 70px;
      height: 70px;
      background: rgba(0,0,0,0.85);
      border: 4px solid #FFD700;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 15px #FFD700;
    }
    .arrow-box:hover {
      background: rgba(255,215,0,0.35);
      transform: scale(1.15);
    }
    .arrow {
      font-size: 2.8rem;
      color: #FFD700;
    }
    #intro-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0 5vw;
    }
    #intro-button {
      padding: 18px 70px;
      font-size: 2.8rem;
      background: #000;
      color: #FFD700;
      border: 5px solid #FFD700;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.4s;
    }
    #intro-button:hover {
      background: #FFD700;
      color: #000;
      transform: scale(1.05);
    }

    /* Fotoğraf büyütme modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    .modal-content {
      max-width: 90%;
      max-height: 85vh;
      border: 4px solid #FFD700;
      border-radius: 15px;
      box-shadow: 0 0 40px #FFD700;
      cursor: pointer;
    }
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #FFD700;
      font-size: 4rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 10001;
    }

    /* Mobil dik mod optimizasyonu */
    @media (max-width: 768px) {
      .title {
        font-size: 2.5rem;
      }
      .sub-title {
        font-size: 1rem;
      }
      .welcome {
        font-size: 1.5rem;
      }
      .product-img {
        max-height: 35vh;
      }
      .arrow-box {
        width: 65px;
        height: 65px;
      }
      .arrow {
        font-size: 2.5rem;
      }
      .product-gallery {
        gap: 20px;
      }
      #intro-button {
        font-size: 2.5rem;
        padding: 15px 60px;
      }
    }
  </style>
</head>
<body>

  <div class="founder">
    Founder
    <div class="founder-sub">Faruk Can Asker</div>
  </div>

  <!-- Giriş sayfası -->
  <div id="intro-page" class="page active">
    <button id="intro-button">GİRİŞ</button>
  </div>

  <!-- Sayfa 1: Hoşgeldiniz -->
  <div id="page1" class="page">
    <div class="title">ENKA</div>
    <div class="sub-title">kuyumculuk</div>
    <div class="welcome">HOŞGELDİNİZ</div>
  </div>

  <!-- Sayfa 2: Pullu Zincir (3 zincir fotoğrafı alt alta) -->
  <div id="page2" class="page">
    <div class="title">Pullu Zincir</div>
    <div class="sub-title">Altın pullu zincir modelleri</div>
    <div class="product-gallery">
      <img src="https://i.imgur.com/PHUKcgC.png" alt="Zincir 1" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/8vUboG3.png" alt="Zincir 2" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/ycqXYHy.png" alt="Zincir 3" class="product-img" onclick="openModal(this.src)">
    </div>
  </div>

  <!-- Sayfa 3: Pullu Bileklik (3 bileklik fotoğrafı alt alta) -->
  <div id="page3" class="page">
    <div class="title">Pullu Bileklik</div>
    <div class="sub-title">Altın pullu bileklik modelleri</div>
    <div class="product-gallery">
      <img src="https://i.imgur.com/B1W7QdF.png" alt="Bileklik 1" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/j8zGzpc.png" alt="Bileklik 2" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/cReTEWw.png" alt="Bileklik 3" class="product-img" onclick="openModal(this.src)">
    </div>
  </div>

  <!-- Oklar (altta sabit, büyük) -->
  <div class="arrow-container">
    <div id="prev-arrow" class="arrow-box"><div class="arrow">←</div></div>
    <div id="next-arrow" class="arrow-box"><div class="arrow">→</div></div>
  </div>

  <!-- Fotoğraf büyütme modal -->
  <div id="modal" class="modal" onclick="closeModal()">
    <span class="close" onclick="closeModal()">×</span>
    <img class="modal-content" id="modalImg">
  </div>

  <script>
    const introPage = document.getElementById('intro-page');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const page3 = document.getElementById('page3');

    const introButton = document.getElementById('intro-button');
    const prevArrow = document.getElementById('prev-arrow');
    const nextArrow = document.getElementById('next-arrow');

    let currentPage = introPage;

    function showPage(targetPage) {
      if (currentPage === targetPage) return;
      currentPage.style.display = 'none';
      targetPage.style.display = 'flex';
      currentPage = targetPage;
    }

    introButton.addEventListener('click', () => showPage(page1));

    nextArrow.addEventListener('click', () => {
      if (currentPage === introPage) showPage(page1);
      else if (currentPage === page1) showPage(page2);
      else if (currentPage === page2) showPage(page3);
    });

    prevArrow.addEventListener('click', () => {
      if (currentPage === page3) showPage(page2);
      else if (currentPage === page2) showPage(page1);
      else if (currentPage === page1) showPage(introPage);
    });

    // Fotoğraf büyütme
    function openModal(src) {
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = src;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
