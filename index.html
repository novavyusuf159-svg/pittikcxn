<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENKA Kuyumculuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: #FFD700;
      font-family: 'Goldman', sans-serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .founder {
      position: absolute;
      top: 20px;
      left: 30px;
      font-size: 1.6rem;
      font-weight: 700;
      color: #FFD700;
      z-index: 10;
    }
    .founder-sub {
      font-size: 1rem;
      color: #FFD700;
      opacity: 0.8;
      margin-top: 5px;
    }
    .page {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.6s ease-in-out;
      padding-top: 12vh;
    }
    .page.active {
      display: flex;
      transform: translateX(0);
    }
    .page.sliding-right {
      transform: translateX(100%);
    }
    .page.sliding-left {
      transform: translateX(-100%);
    }
    .title {
      font-size: 5rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 4px;
      text-align: center;
    }
    .sub-title {
      font-size: 1.6rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .welcome {
      font-size: 2.8rem;
      margin-bottom: 40px;
      text-align: center;
    }
    .product-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 1200px;
      margin-top: 30px;
    }
    .product-img {
      width: 100%;
      border: 4px solid #FFD700;
      border-radius: 15px;
      box-shadow: 0 0 20px #FFD700;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .product-img:hover {
      transform: scale(1.05);
    }
    .arrow-box {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 70px;
      height: 70px;
      background: rgba(0,0,0,0.6);
      border: 4px solid #FFD700;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      z-index: 10;
    }
    .arrow-box:hover {
      background: rgba(255,215,0,0.15);
      transform: translateY(-50%) scale(1.15);
    }
    .arrow {
      font-size: 2.8rem;
      color: #FFD700;
    }
    #next-arrow, #next-arrow-page2 {
      right: 20px;
    }
    #prev-arrow, #prev-arrow-page3 {
      left: 20px;
    }
    #intro-page {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #intro-button {
      padding: 25px 100px;
      font-size: 3.8rem;
      background: #000;
      color: #FFD700;
      border: 6px solid #FFD700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s;
    }
    #intro-button:hover {
      background: #FFD700;
      color: #000;
      transform: scale(1.05);
    }

    /* Mobil uyum */
    @media (max-width: 768px) {
      .title {
        font-size: 3.8rem;
      }
      .sub-title {
        font-size: 1.4rem;
      }
      .welcome {
        font-size: 2.2rem;
      }
      .product-gallery {
        grid-template-columns: 1fr;
      }
      .arrow-box {
        width: 60px;
        height: 60px;
      }
      .arrow {
        font-size: 2.2rem;
      }
      #intro-button {
        font-size: 2.8rem;
        padding: 20px 80px;
      }
    }
  </style>
</head>
<body>

  <div class="founder">
    Founder
    <div class="founder-sub">Faruk Can Asker</div>
  </div>

  <!-- Giriş sayfası -->
  <div id="intro-page" class="page active">
    <button id="intro-button">GİRİŞ</button>
  </div>

  <!-- Sayfa 1: Hoşgeldiniz -->
  <div id="page1" class="page">
    <div class="title">ENKA</div>
    <div class="sub-title">kuyumculuk</div>
    <div class="welcome">HOŞGELDİNİZ</div>
    <div id="next-arrow" class="arrow-box"><div class="arrow">→</div></div>
  </div>

  <!-- Sayfa 2: Pullu Zincir (3 zincir fotoğrafı yan yana) -->
  <div id="page2" class="page">
    <div class="title">Pullu Zincir</div>
    <div class="sub-title">Altın pullu zincir modelleri</div>
    <div class="product-gallery">
      <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471507703322116208/image.png?ex=698f2fd7&is=698dde57&hm=baa00edf92b239202b7e8ecf887d32cab80e58bd308cc7b4ea6db994a5f8d249& alt="Zincir 1" class="product-img">
      <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471513808379052193/image.png?ex=698f3587&is=698de407&hm=3079314c187b59fe87eb2439e5dc434af978bfe66ddd37503dfc8a16837a2a90" alt="Zincir 2" class="product-img">
      <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471513874275631187/image.png?ex=698f3597&is=698de417&hm=0d3452190965680efc5f4d9fc04386fc035644c0eb732bb0fbd4d25a00cb833d" alt="Zincir 3" class="product-img">
    </div>
    <div id="prev-arrow" class="arrow-box"><div class="arrow">←</div></div>
    <div id="next-arrow-page2" class="arrow-box"><div class="arrow">→</div></div>
  </div>

  <!-- Sayfa 3: Pullu Bileklik -->
  <div id="page3" class="page">
    <div class="title">Pullu Bileklik</div>
    <div class="sub-title">Altın pullu bileklik modelleri</div>
    <div class="product-gallery">
    <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471507703322116208/image.png?ex=698f2fd7&is=698dde57&hm=baa00edf92b239202b7e8ecf887d32cab80e58bd308cc7b4ea6db994a5f8d249"  alt="Pullu Bileklik 1" class="product-img">
    <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471512911452307627/image.png?ex=698f34b1&is=698de331&hm=ce822247d24e3ce28761884fd1a588ac4b5c2a41ce69d6735d83071c4580789c&" alt="Pullu Bileklik 2" class="product-img">
    <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471513113785401487/image.png?ex=698f34e1&is=698de361&hm=2dfc3889779a9cb98b67be270899380b048f6b05fd02d89c389ae88c40fa8181&" alt="Pullu Bileklik 3" class="product-img">
    <div id="prev-arrow" class="arrow-box"><div class="arrow">←</div></div>
    <div id="next-arrow-page2" class="arrow-box"><div class="arrow">→</div></div>
  </div>

  <script>
    const introPage = document.getElementById('intro-page');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const page3 = document.getElementById('page3');

    const introButton = document.getElementById('intro-button');
    const nextArrowPage1 = document.getElementById('next-arrow');
    const prevArrowPage2 = document.getElementById('prev-arrow');
    const nextArrowPage2 = document.getElementById('next-arrow-page2');
    const prevArrowPage3 = document.getElementById('prev-arrow-page3');

    function goToPage(current, next) {
      current.classList.add('sliding-right');
      setTimeout(() => {
        current.style.display = 'none';
        current.classList.remove('sliding-right');
        next.style.display = 'flex';
        next.classList.add('active');
      }, 600);
    }

    function goBackPage(current, prev) {
      current.classList.add('sliding-left');
      setTimeout(() => {
        current.style.display = 'none';
        current.classList.remove('sliding-left');
        prev.style.display = 'flex';
        prev.classList.add('active');
      }, 600);
    }

    introButton.addEventListener('click', () => {
      introPage.style.display = 'none';
      page1.style.display = 'flex';
      page1.classList.add('active');
    });

    nextArrowPage1.addEventListener('click', () => goToPage(page1, page2));

    prevArrowPage2.addEventListener('click', () => goBackPage(page2, page1));

    nextArrowPage2.addEventListener('click', () => goToPage(page2, page3));

    prevArrowPage3.addEventListener('click', () => goBackPage(page3, page2));
  </script>
</body>
</html>
