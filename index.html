<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENKA Kuyumculuk</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: #FFD700; /* Altın sarısı */
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .page {
      display: none;
      width: 100%;
      height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      transition: left 0.5s ease;
    }
    .page.active {
      display: flex;
      left: 0;
    }
    .page.sliding {
      left: 100%;
    }
    #intro-page {
      display: flex;
    }
    #intro-button {
      padding: 20px 60px;
      font-size: 2.5rem;
      background: #000;
      color: #FFD700;
      border: 4px solid #FFD700;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #FFD700;
      transition: all 0.3s;
    }
    #intro-button:hover {
      background: #FFD700;
      color: #000;
      box-shadow: 0 0 40px #FFD700;
      transform: scale(1.1);
    }
    .main-title {
      font-size: 6rem;
      text-transform: uppercase;
      text-shadow: 0 0 20px #FFD700;
      margin-bottom: 10px;
    }
    .sub-title {
      font-size: 1.5rem;
      text-shadow: 0 0 10px #FFD700;
      margin-bottom: 20px;
    }
    .welcome {
      font-size: 2rem;
      text-shadow: 0 0 15px #FFD700;
      margin-bottom: 50px;
    }
    .arrow {
      position: absolute;
      bottom: 50%;
      font-size: 4rem;
      cursor: pointer;
      color: #FFD700;
      text-shadow: 0 0 15px #FFD700;
      transition: all 0.3s;
    }
    .arrow:hover {
      transform: scale(1.2);
      text-shadow: 0 0 30px #FFD700;
    }
    #next-arrow {
      right: 50px;
    }
    #prev-arrow {
      left: 50px;
    }
  </style>
</head>
<body>

  <!-- Giriş sayfası -->
  <div id="intro-page" class="page active">
    <button id="intro-button">GİRİŞ</button>
  </div>

  <!-- Sayfa 1: Hoşgeldiniz -->
  <div id="page1" class="page">
    <div class="main-title">ENKA</div>
    <div class="sub-title">kuyumculuk</div>
    <div class="welcome">Hoşgeldiniz</div>
    <div id="next-arrow-page1" class="arrow next-arrow">&gt;</div>
  </div>

  <!-- Sayfa 2: Pullu Zincir -->
  <div id="page2" class="page">
    <div class="main-title">Pullu Zincir</div>
    <div class="sub-title"> (Şimdilik boş, fotoğraflar sonra eklenecek) </div>
    <div id="prev-arrow-page2" class="arrow prev-arrow">&lt;</div>
    <div id="next-arrow-page2" class="arrow next-arrow">&gt;</div>
  </div>

  <!-- Sayfa 3: Pullu Bileklik -->
  <div id="page3" class="page">
    <div class="main-title">Pullu Bileklik</div>
    <div class="sub-title"> (Şimdilik boş, fotoğraflar sonra eklenecek) </div>
    <div id="prev-arrow-page3" class="arrow prev-arrow">&lt;</div>
  </div>

  <script>
    const introButton = document.getElementById('intro-button');
    const introPage = document.getElementById('intro-page');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const page3 = document.getElementById('page3');

    const nextArrowPage1 = document.getElementById('next-arrow-page1');
    const prevArrowPage2 = document.getElementById('prev-arrow-page2');
    const nextArrowPage2 = document.getElementById('next-arrow-page2');
    const prevArrowPage3 = document.getElementById('prev-arrow-page3');

    // Giriş butonu
    introButton.addEventListener('click', () => {
      introPage.style.display = 'none';
      page1.style.display = 'flex';
    });

    // Sayfa geçişleri
    nextArrowPage1.addEventListener('click', () => {
      page1.style.left = '-100%';
      page2.style.display = 'flex';
      page2.style.left = '0';
    });

    prevArrowPage2.addEventListener('click', () => {
      page2.style.left = '100%';
      page1.style.left = '0';
    });

    nextArrowPage2.addEventListener('click', () => {
      page2.style.left = '-100%';
      page3.style.display = 'flex';
      page3.style.left = '0';
    });

    prevArrowPage3.addEventListener('click', () => {
      page3.style.left = '100%';
      page2.style.left = '0';
    });
  </script>
</body>
</html>
