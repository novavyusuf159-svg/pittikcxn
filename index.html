<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ENKA Kuyumculuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: #FFD700;
      font-family: 'Goldman', sans-serif;
      min-height: 100vh;
      overflow-y: auto;
      position: relative;
    }
    /* Altın partikül arka plan */
    canvas#particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
    }
    .founder {
      position: fixed;
      top: 15px;
      left: 15px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #FFD700;
      z-index: 100;
      text-shadow: 0 0 10px #FFD700;
      animation: pulseGlow 4s infinite alternate;
    }
    .founder-sub {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 3px;
    }
    .header-icons {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
    }
    .instagram-logo, .custom-logo {
      width: 45px;
      height: 45px;
      cursor: pointer;
      transition: all 0.4s ease;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255,215,0,0.4);
      animation: pulseGlow 5s infinite alternate;
    }
    .instagram-logo:hover, .custom-logo:hover {
      transform: scale(1.15) rotate(5deg);
      box-shadow: 0 0 35px #FFD700;
    }
    .page {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 15vh 5vw 140px;
      position: relative;
      z-index: 1;
    }
    .page.active {
      display: flex;
    }
    .title {
      font-size: 3.5rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 3px;
      text-align: center;
      text-shadow: 0 0 15px #FFD700;
      animation: pulseGlow 6s infinite alternate;
    }
    .sub-title {
      font-size: 1.3rem;
      margin-bottom: 25px;
      text-align: center;
      text-shadow: 0 0 10px #FFD700;
    }
    .welcome {
      font-size: 2rem;
      margin-bottom: 40px;
      text-align: center;
      text-shadow: 0 0 10px #FFD700;
    }
    .product-gallery {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 95%;
      max-width: 500px;
      margin: 20px 0 80px;
    }
    .product-img {
      width: 100%;
      border: 4px solid #FFD700;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255,215,0,0.3);
      object-fit: cover;
      cursor: pointer;
      transition: all 0.4s ease;
      position: relative;
      overflow: hidden;
    }
    .product-img:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px #FFD700;
      border-color: #fff;
    }
    .product-img::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(135deg, transparent 40%, rgba(255,215,0,0.2) 50%, transparent 60%);
      opacity: 0;
      transition: opacity 0.5s;
    }
    .product-img:hover::after {
      opacity: 1;
    }
    .arrow-container {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 9999;
      pointer-events: auto;
    }
    .arrow-box {
      width: 80px;
      height: 80px;
      background: rgba(0,0,0,0.8);
      border: 5px solid #FFD700;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 0 15px #FFD700;
      animation: pulseGlow 4s infinite alternate;
    }
    .arrow-box:hover {
      background: rgba(255,215,0,0.2);
      transform: scale(1.15) translateY(-5px);
      box-shadow: 0 15px 30px rgba(255,215,0,0.5);
    }
    .arrow {
      font-size: 3rem;
      color: #FFD700;
      text-shadow: 0 0 10px #FFD700;
    }
    #intro-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0 5vw;
    }
    #intro-button {
      padding: 20px 80px;
      font-size: 3rem;
      background: linear-gradient(135deg, #000, #1a1a00);
      color: #FFD700;
      border: 6px solid #FFD700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 0 0 20px rgba(255,215,0,0.5);
      animation: pulseGlow 5s infinite alternate;
    }
    #intro-button:hover {
      background: linear-gradient(135deg, #FFD700, #ffea80);
      color: #000;
      transform: scale(1.08) translateY(-5px);
      box-shadow: 0 15px 40px rgba(255,215,0,0.7);
    }

    /* Fotoğraf büyütme modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
      overflow: auto;
      backdrop-filter: blur(5px);
    }
    .modal-content {
      max-width: 90%;
      max-height: 85vh;
      border: 6px solid #FFD700;
      border-radius: 20px;
      box-shadow: 0 0 60px #FFD700, 0 0 100px rgba(255,215,0,0.5);
      cursor: pointer;
      animation: zoomIn 0.4s ease;
      object-fit: contain;
    }
    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: #FFD700;
      font-size: 4.5rem;
      font-weight: bold;
      cursor: pointer;
      text-shadow: 0 0 15px #FFD700;
      transition: all 0.3s;
    }
    .close:hover {
      color: #fff;
      transform: rotate(90deg);
      text-shadow: 0 0 30px #FFD700;
    }

    /* Nabız atan altın glow animasyonu */
    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px #FFD700; box-shadow: 0 0 10px #FFD700; }
      100% { text-shadow: 0 0 25px #FFD700; box-shadow: 0 0 30px #FFD700; }
    }

    /* Mobil dik mod */
    @media (max-width: 768px) {
      .title {
        font-size: 2.8rem;
      }
      .sub-title {
        font-size: 1.1rem;
      }
      .welcome {
        font-size: 1.6rem;
      }
      .product-img {
        max-height: 35vh;
      }
      .arrow-box {
        width: 70px;
        height: 70px;
      }
      .arrow {
        font-size: 2.8rem;
      }
      .product-gallery {
        gap: 25px;
      }
      .modal-content {
        max-width: 95%;
        max-height: 80vh;
      }
      .close {
        font-size: 4rem;
        top: 20px;
        right: 25px;
      }
      .instagram-logo, .custom-logo, .music-control {
        width: 40px;
        height: 40px;
      }
      .header-icons {
        gap: 10px;
        right: 10px;
        top: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Altın partikül arka plan -->
  <canvas id="particles-js"></canvas>

  <div class="founder">
    Founder
    <div class="founder-sub">Faruk Can Asker</div>
  </div>

  <!-- Sağ üst ikonlar -->
  <div class="header-icons">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/1024px-Instagram_icon.png" alt="Instagram" class="instagram-logo" onclick="window.open('https://www.instagram.com/enka_kuyumculuk/', '_blank')">
    <img src="https://i.imgur.com/KvzGKxo.png" alt="ENKA Logo" class="custom-logo" onclick="openLogoModal()">
  </div>

  <!-- Giriş sayfası -->
  <div id="intro-page" class="page active">
    <button id="intro-button">GİRİŞ</button>
  </div>

  <!-- Sayfa 1: Hoşgeldiniz -->
  <div id="page1" class="page">
    <div class="title">ENKA</div>
    <div class="sub-title">kuyumculuk</div>
    <div class="welcome">HOŞGELDİNİZ</div>
  </div>

  <!-- Sayfa 2: Pullu Zincir -->
  <div id="page2" class="page">
    <div class="title">Pullu Zincir</div>
    <div class="sub-title">Altın pullu zincir modelleri</div>
    <div class="product-gallery">
      <img src="https://i.imgur.com/PHUKcgC.png" alt="Zincir 1" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/8vUboG3.png" alt="Zincir 2" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/ycqXYHy.png" alt="Zincir 3" class="product-img" onclick="openModal(this.src)">
    </div>
  </div>

  <!-- Sayfa 3: Pullu Bileklik -->
  <div id="page3" class="page">
    <div class="title">Pullu Bileklik</div>
    <div class="sub-title">Altın pullu bileklik modelleri</div>
    <div class="product-gallery">
      <img src="https://i.imgur.com/B1W7QdF.png" alt="Bileklik 1" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/j8zGzpc.png" alt="Bileklik 2" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/cReTEWw.png" alt="Bileklik 3" class="product-img" onclick="openModal(this.src)">
    </div>
  </div>

  <!-- Sayfa 4: Küpeler -->
  <div id="page4" class="page">
    <div class="title">Küpeler</div>
    <div class="sub-title">Altın küpe modelleri</div>
    <div class="product-gallery">
      <img src="https://i.imgur.com/is1dFof.png" alt="Küpe 1" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/ECQbMMI.png" alt="Küpe 2" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/eZYFQdU.png" alt="Küpe 3" class="product-img" onclick="openModal(this.src)">
    </div>
  </div>

  <!-- Sayfa 5: Farklı Pullu Modelleri -->
  <div id="page5" class="page">
    <div class="title">Farklı Pullu Modelleri</div>
    <div class="sub-title">Özel pullu takı modelleri</div>
    <div class="product-gallery">
      <img src="https://i.imgur.com/feQEkBz.png" alt="Pullu Model 1" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/kr2yH3z.png" alt="Pullu Model 2" class="product-img" onclick="openModal(this.src)">
      <img src="https://i.imgur.com/hhV24pN.png" alt="Pullu Model 3" class="product-img" onclick="openModal(this.src)">
    </div>
  </div>

  <!-- Oklar -->
  <div class="arrow-container">
    <div id="prev-arrow" class="arrow-box"><div class="arrow">←</div></div>
    <div id="next-arrow" class="arrow-box"><div class="arrow">→</div></div>
  </div>

  <!-- Fotoğraf büyütme modal -->
  <div id="modal" class="modal" onclick="closeModal()">
    <span class="close" onclick="closeModal()">×</span>
    <img class="modal-content" id="modalImg">
  </div>

  <!-- Logo tıklayınca çıkan özel modal -->
  <div id="logoModal" class="modal" onclick="closeLogoModal()">
    <span class="close" onclick="closeLogoModal()">×</span>
    <img class="modal-content" id="logoModalImg" src="https://i.imgur.com/O9LR3Gj.png">
  </div>

  <!-- Particles.js kütüphanesi (altın partikül için) -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": {
          "value": 40,
          "density": { "enable": true, "value_area": 800 }
        },
        "color": { "value": "#FFD700" },
        "shape": { "type": "circle" },
        "opacity": {
          "value": 0.4,
          "random": true,
          "anim": { "enable": true, "speed": 1, "opacity_min": 0.1 }
        },
        "size": {
          "value": 3,
          "random": true,
          "anim": { "enable": false }
        },
        "line_linked": {
          "enable": false
        },
        "move": {
          "enable": true,
          "speed": 0.8,
          "direction": "none",
          "random": true,
          "straight": false,
          "out_mode": "out",
          "bounce": false,
          "attract": { "enable": false }
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": false },
          "onclick": { "enable": false },
          "resize": true
        }
      },
      "retina_detect": true
    });
  </script>

  <script>
    const introPage = document.getElementById('intro-page');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const page3 = document.getElementById('page3');
    const page4 = document.getElementById('page4');
    const page5 = document.getElementById('page5');

    const introButton = document.getElementById('intro-button');
    const prevArrow = document.getElementById('prev-arrow');
    const nextArrow = document.getElementById('next-arrow');

    let currentPage = introPage;

    function showPage(targetPage) {
      if (currentPage === targetPage) return;
      currentPage.style.display = 'none';
      targetPage.style.display = 'flex';
      currentPage = targetPage;
    }

    introButton.addEventListener('click', () => showPage(page1));

    nextArrow.addEventListener('click', () => {
      if (currentPage === introPage) showPage(page1);
      else if (currentPage === page1) showPage(page2);
      else if (currentPage === page2) showPage(page3);
      else if (currentPage === page3) showPage(page4);
      else if (currentPage === page4) showPage(page5);
    });

    prevArrow.addEventListener('click', () => {
      if (currentPage === page5) showPage(page4);
      else if (currentPage === page4) showPage(page3);
      else if (currentPage === page3) showPage(page2);
      else if (currentPage === page2) showPage(page1);
      else if (currentPage === page1) showPage(introPage);
    });

    function openModal(src) {
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = src;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function openLogoModal() {
      document.getElementById('logoModal').style.display = 'flex';
    }

    function closeLogoModal() {
      document.getElementById('logoModal').style.display = 'none';
    }
  </script>
</body>
</html>
