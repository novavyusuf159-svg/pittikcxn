<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENKA Kuyumculuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: #FFD700;
      font-family: 'Goldman', sans-serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8vh; /* Yazıları biraz daha üstte yapar */
    }
    .founder {
      position: absolute;
      top: 20px;
      left: 30px;
      font-size: 1.6rem;
      font-weight: 700;
      color: #FFD700;
      text-shadow: 0 0 8px #FFD700;
    }
    .founder-sub {
      font-size: 1rem;
      color: #FFD700;
      opacity: 0.8;
      margin-top: 4px;
    }
    .page {
      display: none;
      width: 100%;
      height: 100vh;
      align-items: flex-start;
      justify-content: center;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.6s ease-in-out;
    }
    .page.active {
      display: flex;
      transform: translateX(0);
    }
    .page.sliding-right {
      transform: translateX(100%);
    }
    .page.sliding-left {
      transform: translateX(-100%);
    }
    .title {
      font-size: 12rem; /* Kocaman */
      font-weight: 700;
      text-transform: uppercase;
      text-shadow: 0 0 40px #FFD700, 0 0 80px #FFD700;
      margin-bottom: 5px;
      letter-spacing: 15px;
      text-align: center;
    }
    .sub-title {
      font-size: 2.2rem;
      text-shadow: 0 0 15px #FFD700;
      margin-bottom: 40px;
      text-align: center;
    }
    .welcome {
      font-size: 5rem;
      text-shadow: 0 0 30px #FFD700;
      margin-bottom: 100px;
      text-align: center;
    }
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 4.5rem;
      color: #FFD700;
      cursor: pointer;
      text-shadow: 0 0 20px #FFD700;
      transition: all 0.3s;
    }
    .arrow:hover {
      transform: translateY(-50%) scale(1.3);
      text-shadow: 0 0 40px #FFD700;
    }
    #next-arrow {
      right: 40px;
    }
    #prev-arrow {
      left: 40px;
    }
    #intro-page {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #intro-button {
      padding: 35px 140px;
      font-size: 4.8rem;
      background: #000;
      color: #FFD700;
      border: 8px solid #FFD700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 70px #FFD700;
      transition: all 0.4s;
    }
    #intro-button:hover {
      background: #FFD700;
      color: #000;
      box-shadow: 0 0 120px #FFD700;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="founder">
    Founder
    <div class="founder-sub">Faruk Can Asker</div>
  </div>

  <!-- Giriş sayfası -->
  <div id="intro-page" class="page active">
    <button id="intro-button">GİRİŞ</button>
  </div>

  <!-- Sayfa 1: Hoşgeldiniz -->
  <div id="page1" class="page">
    <div class="title">ENKA</div>
    <div class="sub-title">kuyumculuk</div>
    <div class="welcome">HOŞGELDİNİZ</div>
    <div id="next-arrow" class="arrow">&gt;</div>
  </div>

  <!-- Sayfa 2: Pullu Zincir -->
  <div id="page2" class="page">
    <div class="title">Pullu Zincir</div>
    <div class="sub-title">(Fotoğraflar yakında eklenecek)</div>
    <div id="prev-arrow" class="arrow">&lt;</div>
    <div id="next-arrow-page2" class="arrow">&gt;</div>
  </div>

  <!-- Sayfa 3: Pullu Bileklik -->
  <div id="page3" class="page">
    <div class="title">Pullu Bileklik</div>
    <div class="sub-title">(Fotoğraflar yakında eklenecek)</div>
    <div id="prev-arrow-page3" class="arrow">&lt;</div>
  </div>

  <script>
    const introPage = document.getElementById('intro-page');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const page3 = document.getElementById('page3');

    const introButton = document.getElementById('intro-button');
    const nextArrowPage1 = document.getElementById('next-arrow');
    const prevArrowPage2 = document.getElementById('prev-arrow');
    const nextArrowPage2 = document.getElementById('next-arrow-page2');
    const prevArrowPage3 = document.getElementById('prev-arrow-page3');

    introButton.addEventListener('click', () => {
      introPage.style.display = 'none';
      page1.classList.add('active');
    });

    nextArrowPage1.addEventListener('click', () => {
      page1.classList.remove('active');
      page1.classList.add('sliding-right');
      page2.classList.add('active');
    });

    prevArrowPage2.addEventListener('click', () => {
      page2.classList.remove('active');
      page2.classList.add('sliding-right');
      page1.classList.add('active');
    });

    nextArrowPage2.addEventListener('click', () => {
      page2.classList.remove('active');
      page2.classList.add('sliding-right');
      page3.classList.add('active');
    });

    prevArrowPage3.addEventListener('click', () => {
      page3.classList.remove('active');
      page3.classList.add('sliding-right');
      page2.classList.add('active');
    });
  </script>
</body>
</html>
