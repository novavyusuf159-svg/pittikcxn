<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ENKA Kuyumculuk</title>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      color: #FFD700;
      font-family: 'Goldman', sans-serif;
      min-height: 100vh;
      overflow-y: auto;
      position: relative;
    }
    .founder {
      position: fixed;
      top: 10px;
      left: 15px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #FFD700;
      z-index: 100;
    }
    .founder-sub {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 3px;
    }
    .page {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 15vh 5vw 120px;
    }
    .page.active {
      display: flex;
    }
    .title {
      font-size: 3.5rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 3px;
      text-align: center;
    }
    .sub-title {
      font-size: 1.3rem;
      margin-bottom: 25px;
      text-align: center;
    }
    .welcome {
      font-size: 2rem;
      margin-bottom: 40px;
      text-align: center;
    }
    .product-gallery {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 90%;
      max-width: 500px;
      margin: 20px 0 60px;
    }
    .product-img {
      width: 100%;
      border: 4px solid #FFD700;
      border-radius: 15px;
      box-shadow: 0 0 20px #FFD700;
      object-fit: cover;
    }
    .arrow-container {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 9999; /* En üstte olsun */
      pointer-events: auto;
    }
    .arrow-box {
      width: 70px;
      height: 70px;
      background: rgba(0,0,0,0.8);
      border: 4px solid #FFD700;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 15px #FFD700;
    }
    .arrow-box:hover {
      background: rgba(255,215,0,0.25);
      transform: scale(1.15);
    }
    .arrow {
      font-size: 2.8rem;
      color: #FFD700;
    }
    #intro-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 0 5vw;
    }
    #intro-button {
      padding: 20px 80px;
      font-size: 3rem;
      background: #000;
      color: #FFD700;
      border: 6px solid #FFD700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s;
    }
    #intro-button:hover {
      background: #FFD700;
      color: #000;
      transform: scale(1.05);
    }

    /* Mobil dik mod */
    @media (orientation: portrait) and (max-width: 768px) {
      .title {
        font-size: 3rem;
      }
      .sub-title {
        font-size: 1.2rem;
      }
      .welcome {
        font-size: 1.8rem;
      }
      .product-img {
        max-height: 35vh;
      }
      .arrow-box {
        width: 60px;
        height: 60px;
      }
      .arrow {
        font-size: 2.2rem;
      }
      .product-gallery {
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="founder">
    Founder
    <div class="founder-sub">Faruk Can Asker</div>
  </div>

  <!-- Giriş sayfası -->
  <div id="intro-page" class="page active">
    <button id="intro-button">GİRİŞ</button>
  </div>

  <!-- Sayfa 1: Hoşgeldiniz -->
  <div id="page1" class="page">
    <div class="title">ENKA</div>
    <div class="sub-title">kuyumculuk</div>
    <div class="welcome">HOŞGELDİNİZ</div>
  </div>

  <!-- Sayfa 2: Pullu Zincir (3 zincir fotoğrafı alt alta) -->
  <div id="page2" class="page">
    <div class="title">Pullu Zincir</div>
    <div class="sub-title">Altın pullu zincir modelleri</div>
    <div class="product-gallery">
      <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471507703322116208/image.png?ex=698f2fd7&is=698dde57&hm=baa00edf92b239202b7e8ecf887d32cab80e58bd308cc7b4ea6db994a5f8d249" alt="Zincir 1" class="product-img">
      <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471513808379052193/image.png?ex=698f3587&is=698de407&hm=3079314c187b59fe87eb2439e5dc434af978bfe66ddd37503dfc8a16837a2a90" alt="Zincir 2" class="product-img">
      <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471513874275631187/image.png?ex=698f3597&is=698de417&hm=0d3452190965680efc5f4d9fc04386fc035644c0eb732bb0fbd4d25a00cb833d" alt="Zincir 3" class="product-img">
    </div>
  </div>

  <!-- Sayfa 3: Pullu Bileklik (3 bileklik fotoğrafı alt alta) -->
  <div id="page3" class="page">
    <div class="title">Pullu Bileklik</div>
    <div class="sub-title">Altın pullu bileklik modelleri</div>
    <div class="product-gallery">
      <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471512911452307627/image.png?ex=698f34b1&is=698de331&hm=ce822247d24e3ce28761884fd1a588ac4b5c2a41ce69d6735d83071c4580789c" alt="Bileklik 1" class="product-img">
      <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471513113785401487/image.png?ex=698f34e1&is=698de361&hm=2dfc3889779a9cb98b67be270899380b048f6b05fd02d89c389ae88c40fa8181" alt="Bileklik 2" class="product-img">
      <img src="https://cdn.discordapp.com/attachments/1458151186405261539/1471507370147446784/image.png?ex=698f2f88&is=698dde08&hm=524bd7e59f18daa7b06a8cff28e19399b3798820b4c4fff210e24b08dc1b8b7f" alt="Bileklik 3" class="product-img">
    </div>
  </div>

  <!-- Oklar (altta sabit) -->
  <div class="arrow-container">
    <div id="prev-arrow" class="arrow-box"><div class="arrow">←</div></div>
    <div id="next-arrow" class="arrow-box"><div class="arrow">→</div></div>
  </div>

  <script>
    const introPage = document.getElementById('intro-page');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const page3 = document.getElementById('page3');

    const introButton = document.getElementById('intro-button');
    const prevArrow = document.getElementById('prev-arrow');
    const nextArrow = document.getElementById('next-arrow');

    let currentPage = introPage;

    function showPage(targetPage) {
      if (currentPage === targetPage) return;
      currentPage.classList.remove('active');
      currentPage.style.display = 'none';
      targetPage.style.display = 'flex';
      targetPage.classList.add('active');
      currentPage = targetPage;
    }

    introButton.addEventListener('click', () => showPage(page1));

    nextArrow.addEventListener('click', () => {
      if (currentPage === introPage) showPage(page1);
      else if (currentPage === page1) showPage(page2);
      else if (currentPage === page2) showPage(page3);
    });

    prevArrow.addEventListener('click', () => {
      if (currentPage === page3) showPage(page2);
      else if (currentPage === page2) showPage(page1);
      else if (currentPage === page1) showPage(introPage);
    });
  </script>
</body>
</html>
