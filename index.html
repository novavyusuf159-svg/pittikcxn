<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pıttıkcxn - FiveM</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #000 url('https://media.tenor.com/your_image_link_here.gif') no-repeat center center fixed; /* Senin attığın LEGEND görselinin direkt linkini buraya yapıştır! (sağ tık > kopyala link) */
      background-size: cover;
      color: #ff0044;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); /* loş katman, görseli arka planda tutar */
      z-index: -2;
    }
    header {
      width: 100%;
      text-align: center;
      padding: 20px 0 5px;
      font-size: 3.8rem; /* hafif küçülttüm */
      font-weight: bold;
      text-shadow: 0 0 20px #ff0044, 0 0 40px #ff0044;
      letter-spacing: 6px;
      z-index: 5;
    }
    #legendsText {
      font-size: 2.8rem;
      color: #fff;
      text-shadow: 0 0 15px #fff, 0 0 30px #ff0044;
      letter-spacing: 4px;
      margin: -15px 0 15px;
      text-transform: uppercase;
      z-index: 5;
    }
    .container {
      width: 100%;
      height: 35vh;
      position: relative;
      margin: 15px 0;
      z-index: 5;
    }
    #snakeGame {
      width: 100%;
      height: 100%;
      background: rgba(17,17,17,0.75); /* yarı şeffaf, arka plan görseli hafif görünsün */
      border: 4px solid #ff0044;
      box-shadow: 0 0 30px #ff0044;
    }
    #titleOverlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5.5rem;
      font-weight: bold;
      color: rgba(255,0,68,0.6);
      text-shadow: 0 0 25px #ff0044;
      pointer-events: none;
      z-index: 10;
      letter-spacing: 8px;
    }
    #tokenText {
      font-size: 1.5rem; /* büyüttüm, net olsun */
      color: #00ff9d;
      text-shadow: 0 0 15px #00ff9d;
      text-align: center;
      margin-top: 10px;
      letter-spacing: 4px;
      z-index: 5;
    }
    .btn {
      margin-top: 30px;
      padding: 20px 60px;
      font-size: 2.5rem;
      background: #ff0044;
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #ff0044;
      transition: all 0.3s;
      z-index: 5;
    }
    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px #ff0044;
    }
    #mainPage, #gamePage {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
    }
    #gamePage { display: none; }
    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 8rem;
      color: #ff0000;
      text-shadow: 0 0 40px #ff0000;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      z-index: 20;
    }
    #ytPlayerContainer {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div id="mainPage">
    <header>Pıttıkcxn</header>
    <div id="legendsText">LEGENDS OF PİTTIKCXN</div>
    <button class="btn" onclick="startGame()">GİRİŞ</button>
  </div>

  <div id="gamePage">
    <div class="container">
      <canvas id="snakeGame"></canvas>
      <div id="titleOverlay">Pıttıkcxn</div>
      <div id="gameOver">GAME OVER</div>
    </div>
    <div id="tokenText">best dou tokencxn</div>
    <div id="ytPlayerContainer">
      <div id="ytplayer"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let ytPlayer;
    let animationId;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytplayer', {
        height: '1',
        width: '1',
        videoId: 'NMRhx71bGo4',
        playerVars: {
          'autoplay': 0,
          'loop': 1,
          'playlist': 'NMRhx71bGo4',
          'controls': 0,
          'showinfo': 0,
          'rel': 0,
          'mute': 1
        },
        events: { 'onReady': onPlayerReady }
      });
    }

    function onPlayerReady(event) {}

    function startGame() {
      document.getElementById('mainPage').style.display = 'none';
      document.getElementById('gamePage').style.display = 'flex';

      if (ytPlayer && ytPlayer.playVideo) {
        ytPlayer.unMute();
        ytPlayer.playVideo();
        ytPlayer.setVolume(40);
      }

      initSnakeGame();
    }

    function initSnakeGame() {
      const canvas = document.getElementById('snakeGame');
      const ctx = canvas.getContext('2d');
      const gameOverEl = document.getElementById('gameOver');

      function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const grid = 20;
      let count = 0;
      let gameActive = true;

      let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
      let apple = { x: 320, y: 320 };

      function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

      function showGameOver() {
        gameActive = false;
        gameOverEl.style.opacity = '1';
        setTimeout(() => {
          gameOverEl.style.opacity = '0';
          resetSnake();
          gameActive = true;
        }, 2000);
      }

      function resetSnake() {
        snake.x = 160;
        snake.y = 160;
        snake.cells = [];
        snake.maxCells = 4;
        snake.dx = grid;
        snake.dy = 0;
        apple.x = getRandomInt(0, canvas.width / grid) * grid;
        apple.y = getRandomInt(0, canvas.height / grid) * grid;
      }

      function loop() {
        if (!gameActive) return;
        animationId = requestAnimationFrame(loop);

        if (++count < 8) return;
        count = 0;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        snake.x += snake.dx;
        snake.y += snake.dy;

        // Kenara çarpma = GAME OVER
        if (snake.x >= canvas.width || snake.x < 0 || snake.y >= canvas.height || snake.y < 0) {
          showGameOver();
          return;
        }

        snake.cells.unshift({x: snake.x, y: snake.y});
        if (snake.cells.length > snake.maxCells) snake.cells.pop();

        if (snake.x === apple.x && snake.y === apple.y) {
          snake.maxCells++;
          apple.x = getRandomInt(0, canvas.width / grid) * grid;
          apple.y = getRandomInt(0, canvas.height / grid) * grid;
        }

        ctx.fillStyle = '#ff0044';
        ctx.fillRect(apple.x, apple.y, grid-2, grid-2);

        ctx.fillStyle = '#00ff9d';
        snake.cells.forEach((cell, index) => {
          ctx.fillRect(cell.x, cell.y, grid-2, grid-2);
          if (index === 0) ctx.fillStyle = '#00ccff';
        });

        for (let i = 1; i < snake.cells.length; i++) {
          if (snake.x === snake.cells[i].x && snake.y === snake.cells[i].y) {
            showGameOver();
            return;
          }
        }
      }

      document.addEventListener('keydown', e => {
        if (!gameActive) return;
        if (e.key === 'ArrowLeft' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
        else if (e.key === 'ArrowUp' && snake.dy === 0) { snake.dx = 0; snake.dy = -grid; }
        else if (e.key === 'ArrowRight' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
        else if (e.key === 'ArrowDown' && snake.dy === 0) { snake.dx = 0; snake.dy = grid; }
      });

      loop();
    }
  </script>
</body>
</html>
